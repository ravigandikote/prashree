<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Simplified PraShree Arts mark: petal ring around the solid centre disc.
       Mirrors the real logo's silhouette (disc ≈ 0.46 of the mandala radius)
       at sizes where the drawn mandala would turn to mush. -->
  <circle cx="24" cy="24" r="23" stroke="#0a0a0a" stroke-width="1.2" fill="#ffffff"/>
  <circle cx="24" cy="24" r="19.5" stroke="#0a0a0a" stroke-width="0.6"/>
  <g stroke="#0a0a0a" stroke-width="0.9" fill="none">
    <ellipse cx="24" cy="13.5" rx="3.4" ry="6.6"/>
    <ellipse cx="24" cy="34.5" rx="3.4" ry="6.6"/>
    <ellipse cx="13.5" cy="24" rx="6.6" ry="3.4"/>
    <ellipse cx="34.5" cy="24" rx="6.6" ry="3.4"/>
    <ellipse cx="16.6" cy="16.6" rx="3.4" ry="6.6" transform="rotate(45 16.6 16.6)"/>
    <ellipse cx="31.4" cy="31.4" rx="3.4" ry="6.6" transform="rotate(45 31.4 31.4)"/>
    <ellipse cx="31.4" cy="16.6" rx="3.4" ry="6.6" transform="rotate(-45 31.4 16.6)"/>
    <ellipse cx="16.6" cy="31.4" rx="3.4" ry="6.6" transform="rotate(-45 16.6 31.4)"/>
  </g>
  <circle cx="24" cy="24" r="10.6" fill="#0a0a0a"/>
</svg>
